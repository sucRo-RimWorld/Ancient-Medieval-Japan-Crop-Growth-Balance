name: Crop growth XML/static validation
on:
  workflow_dispatch:
jobs:
  xml-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate XML ownership, conditional MO, and numeric values
        run: python -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Construct explicit allowlist GitHub Actions subscriber candidate (no Steam upload)
        run: python Tools/build_workshop_candidate.py --output TestResults/WorkshopCandidate
